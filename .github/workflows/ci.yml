name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            commits=$(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            commits=$(git rev-list "${{ github.event.before }}..${{ github.sha }}")
          else
            commits="HEAD"
          fi

          for sha in $commits; do
            git log -1 --pretty=%B "$sha" > "$tmp"
            sh .githooks/commit-msg "$tmp"
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: crystal tool format --check

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: |
          shards install
          mkdir -p bin
          crystal build -o bin/ameba lib/ameba/bin/ameba.cr
          bin/ameba

      - name: Run specs
        run: crystal spec

      - name: Type-check benchmark
        run: crystal build --no-codegen bench/benchmark.cr

      - name: Build docs
        if: matrix.os == 'ubuntu-latest'
        run: crystal docs

  test-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run specs on Alpine (musl)
        run: |
          docker run --rm -v "$PWD:/work" -w /work crystallang/crystal:latest-alpine crystal spec
